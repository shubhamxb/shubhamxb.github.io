<!DOCTYPE html>
<!-- the social preview card (og.png): rendered by `og/render.sh` with headless chrome at 1200x630. not linked from the site. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Schibsted+Grotesk:wght@500&family=Martian+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#0d1230;color:#e9e6de;overflow:hidden}
  .c{position:relative;width:1200px;height:630px;box-sizing:border-box;padding:64px 72px;
     background-image:linear-gradient(#1f2752 1px,transparent 1px),linear-gradient(90deg,#1f2752 1px,transparent 1px);background-size:40px 40px}
  .c::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 20% 40%,rgba(13,18,48,.2),rgba(13,18,48,.92) 70%)}
  .in{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
  .eb{font:400 18px/1 "Martian Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#c9a35e}
  h1{margin:28px 0 0;font:800 128px/.84 "Big Shoulders Display",sans-serif;text-transform:uppercase}
  h1 b{color:#c9a35e;font-weight:800}
  .rig{margin-top:auto;display:flex;align-items:center;gap:18px;font:400 18px/1 "Martian Mono",monospace}
  .p{border:1px solid #2a3263;border-radius:4px;padding:14px 16px;background:#131a3e}
  .p.a{border-top:2px solid #c9a35e}.p.b{border-top:2px solid #ff8a5b}
  .n{font:800 30px/1 "Big Shoulders Display",sans-serif;text-transform:uppercase}
  .a .n{color:#c9a35e}.b .n{color:#ff8a5b}
  .ln{flex:0 0 120px;border-top:1px dashed #2a3263;position:relative}
  .ln i{position:absolute;left:46%;top:-4px;width:8px;height:8px;border-radius:50%;background:#4fd1c5;box-shadow:0 0 12px #4fd1c5}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4fd1c5;margin-right:8px}
  .url{margin-left:auto;font:500 26px/1 "Schibsted Grotesk",sans-serif;color:#e9e6de}
  .url span{color:#8a90b4}
</style></head>
<body><div class="c"><div class="in">
  <p class="eb">Shubham Bhagwat · builds digital systems</p>
  <h1>I build systems<br>that run <b>themselves.</b></h1>
  <div class="rig">
    <div class="p a"><div class="n">the overlook</div></div>
    <div class="ln"><i></i></div>
    <div class="p b"><div class="n">hearth</div></div>
    <span style="color:#8a90b4;margin-left:14px"><span class="dot"></span>47/47 up</span>
    <span class="url"><span>shubhamxb</span>.github.io</span>
  </div>
</div></div></body></html>
